<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: navy top bar + section tabs; each section is a grid of cards that collapses to one column on phones. */
:root{
  --bg:#F4F8F9; --surface:#FFFFFF; --ink:#0F2A3A; --muted:#4F5D6B; --line:#D5DEE4;
  --aqua:#0E7C86; --aqua-soft:#DDF1F2; --aqua-ink:#0B5F67;
  --blue:#1E4FA8; --blue-soft:#E2EAF8; --blue-ink:#1A3F86;
  --amber-soft:#FCEFDD; --amber-ink:#8A4A08; --grey-soft:#EEF1F4; --grey-mark:#8C9AA6;
  --rag-g:#2E9E5B; --rag-g-soft:#DDF3E4; --rag-g-ink:#17663A; --rag-a:#E0A100; --rag-a-soft:#FCF0D2; --rag-a-ink:#7A5200; --rag-r:#D64535; --rag-r-soft:#FBE3E1; --rag-r-ink:#A3261B;
  --bar:#0F2A3A; --bar-ink:#FFFFFF; --bar-muted:#B9CAD5; --bar-line:#3B5566;
  --display:"Space Grotesk","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A24; --surface:#12242F; --ink:#E6EEF2; --muted:#9FB0BC; --line:#24394A;
  --aqua:#2BB3BD; --aqua-soft:#0F3B40; --aqua-ink:#7FD9DF;
  --blue:#5B8DEF; --blue-soft:#17294A; --blue-ink:#A9C2F5;
  --amber-soft:#3A2A12; --amber-ink:#F0B970; --grey-soft:#1B2C38; --grey-mark:#6F8291;
  --rag-g:#4CC27E; --rag-g-soft:#123524; --rag-g-ink:#8FE0B0; --rag-a:#F2BE3A; --rag-a-soft:#3A2F10; --rag-a-ink:#F5D27E; --rag-r:#F06A5B; --rag-r-soft:#3D1A17; --rag-r-ink:#F7A79E;
  --bar:#07131B; --bar-ink:#FFFFFF; --bar-muted:#9FB0BC; --bar-line:#24394A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A24; --surface:#12242F; --ink:#E6EEF2; --muted:#9FB0BC; --line:#24394A;
  --aqua:#2BB3BD; --aqua-soft:#0F3B40; --aqua-ink:#7FD9DF;
  --blue:#5B8DEF; --blue-soft:#17294A; --blue-ink:#A9C2F5;
  --amber-soft:#3A2A12; --amber-ink:#F0B970; --grey-soft:#1B2C38; --grey-mark:#6F8291;
  --rag-g:#4CC27E; --rag-g-soft:#123524; --rag-g-ink:#8FE0B0; --rag-a:#F2BE3A; --rag-a-soft:#3A2F10; --rag-a-ink:#F5D27E; --rag-r:#F06A5B; --rag-r-soft:#3D1A17; --rag-r-ink:#F7A79E;
  --bar:#07131B; --bar-ink:#FFFFFF; --bar-muted:#9FB0BC; --bar-line:#24394A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:15}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:20px;padding:0 6px}
.logo svg{display:block}
.logo .beat{transform-origin:30.5px 16px}
@media (prefers-reduced-motion:no-preference){.logo .beat{animation:beat 1.6s ease-in-out infinite}}
@keyframes beat{0%,60%,100%{transform:scale(1);opacity:1}20%{transform:scale(1.7);opacity:.6}35%{transform:scale(1.1);opacity:1}}
.fieldlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted);padding:0 6px;margin-bottom:6px;display:block}
.product{font:inherit;font-size:14px;color:var(--bar-ink);background:rgba(255,255,255,.06);border:1px solid var(--bar-line);border-radius:6px;padding:9px 10px;width:100%}
.product option{color:#0F2A3A}
.nav{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted);padding:12px 8px 6px}
.nav a,.nav .soon{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:6px;color:var(--bar-ink);text-decoration:none;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:rgba(43,196,206,.16);color:#7FE1E8;font-weight:600;box-shadow:inset 3px 0 0 #2BC4CE}
.nav svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .soon{color:var(--bar-muted);opacity:.75}
.nav .soon em{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:.08em;border:1px solid var(--bar-line);border-radius:8px;padding:1px 6px}
.badge{margin-left:auto;font-size:11px;font-weight:700;background:#2BC4CE;color:#0F2A3A;border-radius:9px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--bar-line);padding-top:14px}
.side .seg{border-color:var(--bar-line);display:flex}
.side .seg button{color:var(--bar-ink);flex:1}
.side .seg button[aria-pressed="true"]{background:var(--aqua);color:#fff}
.side .tip{color:var(--bar-muted)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.themes{grid-template-columns:minmax(0,1fr)}}
.themeopt{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.themeopt[aria-pressed="true"]{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-soft)}
.themeopt .pv{display:flex;height:84px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.themeopt .pv i{display:block}
.themeopt b{display:flex;justify-content:space-between;align-items:center}
.check{width:18px;height:18px;border-radius:9px;border:2px solid var(--line);display:inline-block}
.themeopt[aria-pressed="true"] .check{border-color:var(--aqua);background:var(--aqua);box-shadow:inset 0 0 0 3px var(--surface)}
.side .tip::after{top:auto;bottom:calc(100% + 8px);left:auto;right:-4px;max-width:200px}
.content{min-width:0;display:flex;flex-direction:column}
.pagebar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.pagebar .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.crumb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.crumb small{font-size:12px;color:var(--muted)}
.crumb b{font-family:var(--display);font-size:20px}
.menu{display:none;font:inherit;background:none;border:1px solid var(--line);border-radius:6px;width:44px;height:44px;color:var(--ink);cursor:pointer;align-items:center;justify-content:center}
.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}
.updated{font-size:12px;color:var(--muted)}
.linkbtn{font:inherit;font-size:12px;background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.45);z-index:14}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(280px,85vw);transform:translateX(-102%);transition:transform .2s ease}
  .side.open{transform:none}
  .menu{display:inline-flex}
}
main{padding-block:24px 48px}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--amber-soft);color:var(--amber-ink);border-radius:10px;padding:3px 10px;font-weight:600}
h1{font-family:var(--display);font-size:clamp(24px,3vw,30px);margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:68ch;font-size:15px}
.grid{display:grid;gap:18px}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-progress{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr)}
.g-road{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.g-mkt{grid-template-columns:minmax(0,1.1fr) minmax(0,3fr)}
.g-mkt2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g-main,.g-progress,.g-road,.g-mkt,.g-mkt2,.g3{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g4,.g5{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:10px;padding:3px 10px;white-space:nowrap}
.p-good{background:var(--aqua-soft);color:var(--aqua-ink)}
.p-info{background:var(--blue-soft);color:var(--blue-ink)}
.p-warn{background:var(--amber-soft);color:var(--amber-ink)}
.p-none{background:var(--grey-soft);color:var(--muted)}
.rag-g{background:var(--rag-g-soft);color:var(--rag-g-ink)}
.rag-a{background:var(--rag-a-soft);color:var(--rag-a-ink)}
.rag-r{background:var(--rag-r-soft);color:var(--rag-r-ink)}
.pill.rag-g::before,.pill.rag-a::before,.pill.rag-r::before,.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
.rag-g::before,.dot.g::before{background:var(--rag-g)}
.rag-a::before,.dot.a::before{background:var(--rag-a)}
.rag-r::before,.dot.r::before{background:var(--rag-r)}
.ragkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.vision{background:linear-gradient(135deg,#0E7C86,#1E4FA8);color:#fff;border:0}
.vision .eyebrow{color:#CFEFF1}
.vision p{margin:0;font-size:20px;line-height:1.4}
.person{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px}
.avatar{width:38px;height:38px;border-radius:19px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.track{height:12px;background:var(--grey-soft);border-radius:6px;position:relative}
.track .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#12A1AB,#1E4FA8)}
.track .mark{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink)}
.box{border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.col{border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.video{aspect-ratio:16/10;max-width:100%;border-radius:6px;background:linear-gradient(135deg,#0E7C86,#1E4FA8);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;width:100%}
.video span{width:40px;height:40px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center}
.video span::after{content:"";border-left:13px solid #0E7C86;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center}
.mbar{height:8px;background:var(--grey-soft);border-radius:4px;flex:1;min-width:60px}
.mbar div{height:100%;border-radius:4px}
.dark{background:var(--bar);color:var(--bar-ink);border:0}
.dark .muted{color:var(--bar-muted)}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;min-height:44px;background:var(--aqua);color:#fff}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.promise{border-top:5px solid var(--aqua)}
.promise.next{border-top-color:var(--blue)}
.promise.no{border-top-color:var(--grey-mark)}
.timeline{display:flex;flex-direction:column;border-left:3px solid var(--aqua-soft);margin-left:6px}
.timeline div{display:flex;gap:12px;padding:7px 0;margin-left:-8px}
.timeline b{width:13px;height:13px;border-radius:7px;background:var(--aqua);border:2px solid var(--surface);flex-shrink:0;margin-top:4px}
.win{background:var(--rag-g-soft);border-radius:6px;padding:8px 10px}
.lose{background:var(--amber-soft);border-radius:6px;padding:8px 10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);padding:20px max(20px,env(safe-area-inset-right,0px)) 20px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;z-index:20;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:13px;z-index:30}
svg text{font-family:var(--body)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;border:1px solid currentColor;background:transparent;color:var(--muted);font:600 11px/1 var(--body);cursor:help;padding:0;vertical-align:middle;flex-shrink:0}
.tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:-8px;width:max-content;max-width:min(270px,80vw);background:var(--ink);color:var(--bg);font:400 12px/1.45 var(--body);letter-spacing:0;text-transform:none;text-align:left;padding:9px 11px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:40;display:none;pointer-events:none}
.tip.left::after{left:auto;right:-8px}
.tip:hover::after,.tip:focus::after{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 12px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.kpi{gap:8px}
.kpi .big{font-size:28px}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--grey-soft)}
.stackbar div{height:100%}
.version{font-size:11px;color:var(--bar-muted);padding:0 6px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.num{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--grey-soft);color:var(--muted)}
.num.done{background:var(--aqua);color:#fff}
@media (max-width:560px){.step{grid-template-columns:36px minmax(0,1fr)}.step .pill{grid-column:2;justify-self:start}}
</style>
</head>
<body>

<div class="app">
<aside class="side" id="side" aria-label="Okana navigation">
  <span class="logo"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="okg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2BC4CE"></stop><stop offset="1" stop-color="#3D7BFF"></stop></linearGradient></defs><circle cx="16" cy="16" r="12" fill="none" stroke="url(#okg)" stroke-width="2.4"></circle><path d="M1.5 16 H8.5 L10.8 12.6 L13.6 21.4 L16.6 5.8 L19.6 19.4 L21.6 16 H30.5" fill="none" stroke="var(--bar)" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M1.5 16 H8.5 L10.8 12.6 L13.6 21.4 L16.6 5.8 L19.6 19.4 L21.6 16 H30.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path><circle class="beat" cx="30.5" cy="16" r="1.8" fill="#2BC4CE"></circle></svg>Okana</span>
  <div><label class="fieldlabel" for="product">Product</label><select id="product" class="product"><option>Atlas</option></select></div>
  <nav class="nav" id="tabs" aria-label="Sections">
    <a href="#setup" data-tab="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Setup guide<span class="badge" id="setupBadge">3/7</span></a>
    <a href="#about" data-tab="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>About the product</a>
    <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Product progress</a>
    <a href="#market" data-tab="market"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Market position</a>
    <a href="#health" data-tab="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"></path></svg>Product health</a>
    <a href="#documents" data-tab="documents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4M9 13h6M9 17h6"></path></svg>Documents</a>
    <span class="navlabel">Coming next</span>
    <span class="soon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Geo position<em>V3</em></span>
    <span class="soon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>Transformation<em>V3</em></span>
    <span class="soon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Sales status<em>V3</em></span>
  </nav>

// ---------- Okana score: solved = 1, on roadmap = confidence weight, not addressed = 0; weighted by mentions ----------
const CONF_WEIGHT = { High: 0.8, Medium: 0.5, Low: 0.2 };
function okanaScore(themes) {
  const total = themes.reduce((s, t) => s + t.n, 0);
  let points = 0, solved = 0, road = 0, none = 0;
  for (const t of themes) {
    if (t.status === "solved") { points += t.n; solved += t.n; }
    else if (t.status === "roadmap") { points += t.n * CONF_WEIGHT[t.conf]; road += t.n; }
    else none += t.n;
  }
  return { score: Math.round(points / total * 100), total, solved: Math.round(solved / total * 100), road: Math.round(road / total * 100), none: Math.round(none / total * 100) };
}

function ring(score) {

  return `<svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Okana score ${score} out of 100">
    <circle cx="52" cy="52" r="40" fill="none" stroke="var(--grey-soft)" stroke-width="11"></circle>

    <text x="52" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)">${score}</text></svg>`;
}
function scoreTrend(hist, target) {
  const w = 760, h = 240, L = 34, R = 20, T = 18, B = 28, lo = 50, hi = 90;
  const n = hist.atlas.length;
  const x = (i) => L + (n === 1 ? 0.5 : i / (n - 1)) * (w - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (h - T - B);
  const line = (vals) => vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let grid = "";
  for (const g of [50, 60, 70, 80, 90]) grid += `<line x1="${L}" x2="${w - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"></line><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${g}</text>`;
  const xl = hist.labels.map((l, i) => `<text x="${x(i)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`).join("");
  const pts = hist.atlas.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 5 : 3.5}" fill="var(--aqua)"></circle><text x="${x(i)}" y="${y(v) - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--aqua-ink)">${v}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Atlas score from ${hist.atlas[0]} to ${hist.atlas[n - 1]}; competitor average from ${hist.market[0]} to ${hist.market[n - 1]}; target ${target}">
    ${grid}
    <line x1="${L}" x2="${w - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--aqua-ink)" stroke-width="1.5" stroke-dasharray="6 4"></line>
    <text x="${w - R}" y="${y(target) - 5}" text-anchor="end" font-size="10" font-weight="600" fill="var(--aqua-ink)">Target ${target}</text>
    <polyline points="${line(hist.market)}" fill="none" stroke="var(--grey-mark)" stroke-width="2" stroke-dasharray="3 3"></polyline>
    <polygon points="${x(0)},${y(lo)} ${line(hist.atlas)} ${x(n - 1)},${y(lo)}" fill="var(--aqua-soft)" opacity=".7"></polygon>
    <polyline points="${line(hist.atlas)}" fill="none" stroke="var(--aqua)" stroke-width="3"></polyline>
    ${pts}${xl}</svg>`;
}
function burndown(sp) {
  const w = 400, h = 150, L = 34, B = 24, T = 10, R = 10;
  const x = (d) => L + d * (w - L - R) / sp.length, y = (p) => T + (1 - p / sp.total) * (h - T - B);
  const actual = sp.remaining.map((p, d) => `${x(d).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
  const last = sp.remaining.length - 1;
  let ticks = "";
  for (const p of [0, Math.round(sp.total / 2), sp.total]) ticks += `<line x1="${L}" x2="${w - R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)"></line><text x="${L - 6}" y="${y(p) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${p}</text>`;
  for (const d of [0, Math.round(sp.length / 2), sp.length]) ticks += `<text x="${x(d)}" y="${h - 6}" text-anchor="${d === sp.length ? "end" : d === 0 ? "start" : "middle"}" font-size="10" fill="var(--muted)">Day ${d}</text>`;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Burndown: ${sp.remaining[last]} of ${sp.total} points left on day ${sp.day}">
    ${ticks}
    <polygon points="${x(0)},${y(0)} ${actual} ${x(last)},${y(0)}" fill="var(--aqua-soft)"></polygon>
    <line x1="${x(0)}" y1="${y(sp.total)}" x2="${x(sp.length)}" y2="${y(0)}" stroke="var(--grey-mark)" stroke-width="1.5" stroke-dasharray="5 4"></line>
    <polyline points="${actual}" fill="none" stroke="var(--aqua)" stroke-width="3"></polyline>
    <circle cx="${x(last)}" cy="${y(sp.remaining[last])}" r="5" fill="var(--aqua)"></circle></svg>`;
}
function velocityBars(rows) {
  const max = Math.max(...rows.map((r) => r[1]));
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:130px">${rows.map(([s, p], i) =>

      <span class="small muted">${s}</span></div>`).join("")}</div>`;
}

const PRIORITIES = ["Highest", "High", "Medium", "Low"];
const PRIORITY_COLOUR = { Highest: "var(--rag-r)", High: "var(--rag-a)", Medium: "var(--blue)", Low: "var(--grey-mark)" };
const BAND_LABEL = { g: "Healthy", a: "Watch", r: "Act now" };
function flowChart(f) {
  const w = 560, h = 200, L = 30, R = 8, T = 18, B = 24;
  const max = Math.max(1, ...f.opened, ...f.closed), n = f.labels.length, gw = (w - L - R) / n, bw = Math.min(26, gw / 3);
  const y = (v) => T + (1 - v / max) * (h - T - B);
  let out = "";
  for (const g of [0, Math.round(max / 2), max]) out += `<line x1="${L}" x2="${w - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"></line><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${g}</text>`;
  f.labels.forEach((l, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, x, c) => `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(v)).toFixed(1)}" rx="2" fill="${c}"></rect><text x="${(x + bw / 2).toFixed(1)}" y="${(y(v) - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${v}</text>`;
    out += bar(f.opened[i], cx - bw - 2, "var(--blue)") + bar(f.closed[i], cx + 2, "var(--aqua)");
    out += `<text x="${cx.toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(l)}</text>`;
  });
  const o = f.opened.reduce((s, v) => s + v, 0), c = f.closed.reduce((s, v) => s + v, 0);
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o} bugs opened and ${c} fixed">${out}</svg>`;
}
function renderHealth() {

  if (ttfBand && ttfBand !== "g") attention.push([ttfBand, `Features take ${ttf.days} days from idea to done. Aim for 90 or fewer.`]);
  if (blBand !== "g") attention.push([blBand, `${oldPct}% of the backlog (${bl.old} ${bl.old === 1 ? "item" : "items"}) ${bl.old === 1 ? "is" : "are"} older than 90 days. Review or close old items.`]);
  const o = flow.opened.reduce((s, v) => s + v, 0), c = flow.closed.reduce((s, v) => s + v, 0);

  $("v-health").innerHTML = `
  <div class="head"><div><h1>Product health</h1><p class="lede">Is Atlas getting more stable and quicker to change? Bugs, fix times, delivery speed and backlog, from Jira.</p></div><span class="pill rag-${overall}" style="font-size:14px;padding:6px 14px">Overall: ${BAND_LABEL[overall]}</span></div>

// ---------- Live Jira data (written by the GitHub Action into data/jira.json) ----------
async function loadLiveJira() {
  let d;
  try {
    const r = await fetch(OKANA_CONFIG.liveJiraFile, { cache: "no-store" });
    if (!r.ok) return;
    d = await r.json();
  } catch (err) { return; }
  if (!d || !d.sprint) return;
  const has = (a) => Array.isArray(a) && a.length > 0;
  jiraAdapter.sprint = () => d.sprint;
  if (has(d.velocity)) jiraAdapter.velocity = () => d.velocity;
  if (has(d.roadmap)) jiraAdapter.roadmap = () => d.roadmap;
  if (has(d.milestones)) jiraAdapter.milestones = () => d.milestones;
  if (has(d.releases)) jiraAdapter.releases = () => d.releases;
  const hd = d.health;
  if (hd && hd.openBugs) {
    healthAdapter.openBugs = () => hd.openBugs;
    if (has(hd.fixTime)) healthAdapter.fixTime = () => hd.fixTime;
    if (hd.bugFlow) healthAdapter.bugFlow = () => hd.bugFlow;
    if (hd.timeToFeature) healthAdapter.timeToFeature = () => hd.timeToFeature;
    if (hd.backlog) healthAdapter.backlog = () => hd.backlog;
  }
  const when = new Date(d.fetchedAt);
  const label = isNaN(when) ? "" : when.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  $("dataBadge").textContent = "Live Jira data · other sections sample";
  $("dataBadge").title = "Jira project " + (d.projectKey || "") + ", board " + (d.boardId || "");
  if (label) $("updatedAt").textContent = "Jira synced " + label;
  DATA.audit.unshift([label || "Latest sync", "Jira sync", "Sprint " + d.sprint.number + " synced (" + d.sprint.remaining[d.sprint.remaining.length - 1] + " points left)"]);
  render();
}
loadLiveJira();

// ---------- Documents list (optional data/documents.json, edited by hand in the repository) ----------
async function loadDocuments() {
  try {
    const r = await fetch(OKANA_CONFIG.documentsFile, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    const list = Array.isArray(d) ? d : d && d.documents;
    if (!Array.isArray(list) || list.length === 0) return;
    DATA.documents = list;
    if (d.clientQuestions) DATA.clientQuestions = d.clientQuestions;
    DOCS_AS_OF = new Date();
    render();
  } catch (err) {}
}
loadDocuments();

// ---------- Pendo usage tracking (only runs when a key is set in OKANA_CONFIG) ----------
function startPendo() {
  const key = OKANA_CONFIG.pendoApiKey;
  if (!key) return;
  (function (p, e, n, d) {
    const o = (p[d] = p[d] || {}); o._q = o._q || [];
    ["initialize", "identify", "updateOptions", "pageLoad", "track"].forEach((m) => {
      o[m] = o[m] || function () { o._q[m === "initialize" ? "unshift" : "push"]([m].concat([].slice.call(arguments, 0))); };
    });
    const y = e.createElement(n); y.async = true; y.src = OKANA_CONFIG.pendoCdn + "/agent/static/" + key + "/pendo.js";
    const z = e.getElementsByTagName(n)[0]; z.parentNode.insertBefore(y, z);
  })(window, document, "script", "pendo");
  // Anonymous visitor id per browser; no names or emails are sent.
  let id = "";
  try { id = localStorage.getItem("okana-visitor") || ""; if (!id) { id = "anon-" + Math.random().toString(36).slice(2, 10); localStorage.setItem("okana-visitor", id); } } catch (err) { id = "anon-session"; }
  window.pendo.initialize({ visitor: { id: id, okanaView: state.view }, account: { id: "okana-prototype" } });
}
function trackPage() {
  if (OKANA_CONFIG.pendoApiKey && window.pendo && window.pendo.track) {
    const tab = state.settings ? "settings" : state.view === "sales" ? state.salesTab : state.tab;
    window.pendo.track("Okana page viewed", { page: tab, view: state.view, period: state.period });
  }
}
startPendo();
trackPage(); // the first page view happens before Pendo starts
</script>
